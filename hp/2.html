<html>
<head>
	<title>Гарри Поттер и Филосовский камень</title>
	<style>
   		* {
      			margin: 0;
      			padding: 0;
    		}
    		body, html {
      			width: 100%;
      			height: 100%;
    		}
    		#myVideo {
			width: auto;
      			height: auto;
      			object-fit: contain;
    		}
    		source{
			widht:100%;
			height:100%;
			object-fit: contain;
		}										
  	</style>
</head>
<body>
  <video id="myVideo" playsinline>
		<source src="D:\harry_potter_films\Harry-Potter-&-The-Chamber-of-Secrets.mkv" type="video/mp4">
  </video>

  <script>
    const video = document.getElementById('myVideo');
video.addEventListener('playing', openFullscreen);

// Автозапуск видео после загрузки
video.addEventListener('loadedmetadata', () => {
  // Программный автоклик для запуска полноэкранного режима
  setTimeout(() => {
    video.click();
  }, 100);

  video.play().catch(e => {
    console.warn('Автозапуск заблокирован браузером:', e);
    // Если автозапуск заблокирован, показываем кнопку для ручного запуска
    const playButton = document.createElement('button');
    playButton.textContent = 'Запустить видео';
    playButton.style.cssText = `
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 15px 30px;
      font-size: 18px;
      z-index: 100;
    `;
    playButton.addEventListener('click', () => video.play());
    document.body.appendChild(playButton);
  });
});

// Полноэкранный режим
function openFullscreen() {
  if (video.requestFullscreen) {
    video.requestFullscreen();
  } else if (video.webkitRequestFullscreen) { // Safari
    video.webkitRequestFullscreen();
  } else if (video.msRequestFullscreen) { // IE/Edge
    video.msRequestFullscreen();
  }
}

// Обработчик для ручного запуска полноэкранного режима
video.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    openFullscreen();
  }
});
  </script>
</body>
</html>
